<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos — PrimePrint</title><link rel="stylesheet" href="/css/style.css?v=10"></head>
<body data-page="catalog">
<div id="site-header"></div>
<div class="wrap">
  <div class="crumb" id="crumb">Início › <b>Todos os produtos</b></div>
  <div class="page-hd"><h1>🗂️ Todos os produtos</h1><p class="mut">Configure, veja o preço na hora e receba em casa</p></div>
  <div class="shop" style="margin-top:16px">
    <aside class="filters"><h4>📂 Categorias</h4><div id="filters"></div>
      <h4 style="margin-top:18px">🎟️ Cupons</h4>
      <p class="small mut">Use <b class="mono">BEMVINDO10</b> e ganhe 10% OFF na 1ª compra.</p></aside>
    <div><div class="toolbar"><span class="count" id="count"></span>
      <select id="sort"><option value="sold">Mais vendidos</option><option value="price-asc">Menor preço</option><option value="price-desc">Maior preço</option><option value="rating">Melhor avaliados</option></select></div>
      <div class="prod-grid" id="grid"></div></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="/js/app.js?v=10"></script><script src="/js/shop.js?v=10"></script>
</body></html>
