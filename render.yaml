# Deploy com 1 clique na Render (https://render.com)
services:
  - type: web
    name: primeprint-grafica
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
